name: tests

# Same checks as Build/Scripts/testMatrix.sh, one job per TYPO3/PHP combination.
# Keep the matrix in sync with composer.json, ext_emconf.php and testMatrix.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s lint -p ${{ matrix.php }}

  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '12', php: '8.1' }
          - { typo3: '12', php: '8.2' }
          - { typo3: '12', php: '8.3' }
          - { typo3: '12', php: '8.4' }
          - { typo3: '13', php: '8.2' }
          - { typo3: '13', php: '8.3' }
          - { typo3: '13', php: '8.4' }
          - { typo3: '13', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s composerUpdate -p ${{ matrix.php }} -t ${{ matrix.typo3 }}
      - run: Build/Scripts/runTests.sh -s phpstan -p ${{ matrix.php }} -t ${{ matrix.typo3 }}
      - run: Build/Scripts/runTests.sh -s functional -p ${{ matrix.php }} -t ${{ matrix.typo3 }}

  phpcompat:
    name: PHPCompatibility 8.1-8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s composerUpdate -p 8.5 -t 13
      - run: Build/Scripts/runTests.sh -s phpcompat -p 8.5 -t 13

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s docs
