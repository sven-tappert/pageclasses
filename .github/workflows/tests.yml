name: tests

# Same checks as Build/Scripts/testMatrix.sh, one job per TYPO3/PHP combination.
# The matrix is every TYPO3 version crossed with every PHP version, minus the
# combinations a TYPO3 version does not support (exclude).
# Keep it in sync with composer.json, ext_emconf.php and testMatrix.sh.
# The documentation is checked in docs.yml.

on:
  push:
    paths-ignore:
      - 'Documentation/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'Documentation/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s lint -p ${{ matrix.php }}

  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3: ['11', '12']
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        exclude:
          - { typo3: '11', php: '8.4' }
          - { typo3: '12', php: '7.4' }
          - { typo3: '12', php: '8.0' }
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s composerUpdate -p ${{ matrix.php }} -t ${{ matrix.typo3 }}
      - run: Build/Scripts/runTests.sh -s phpstan -p ${{ matrix.php }} -t ${{ matrix.typo3 }}
      - run: Build/Scripts/runTests.sh -s functional -p ${{ matrix.php }} -t ${{ matrix.typo3 }}

  phpcompat:
    name: PHPCompatibility 7.4-8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Build/Scripts/runTests.sh -s composerUpdate -p 8.4 -t 12
      - run: Build/Scripts/runTests.sh -s phpcompat -p 8.4 -t 12
